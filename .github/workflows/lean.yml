name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 固定ツールチェーン・mathlibキャッシュ・ビルド
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          test: false
          lint: false
      - name: EHMX の依存公理
        run: lake env lean tests/EHMXAxioms.lean
      - name: EHMX 仕様PDFとソースの対応
        run: python3 tools/build_ehmx_spec.py --check
